<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Coastal weather</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Coastal weather</h1>
      <p class="intro">Live data from weather stations along the Norwegian coast.</p>
    </header>

    <main>
      <section>
        <h2>Stations</h2>
        <p id="station-status"></p>
        <ul id="station-list"></ul>
      </section>

      <section id="measurements">
        <h2 id="measurement-heading">Measurements</h2>
        <p id="measurement-status">Click a station to see the latest measurements.</p>
        <ul id="measurement-list"></ul>
      </section>
    </main>
  </body>
</html>
